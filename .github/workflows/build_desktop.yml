name: Build Desktop App v6

on:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target Release Tag (leave blank to attach to the latest release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop_server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        working-directory: ./desktop_server

      - name: Build onedir application
        run: pyinstaller --noconfirm --onedir --windowed --icon="app.ico" --add-data "app.ico;." main.py
        working-directory: ./desktop_server

      - name: Create release archive
        run: Compress-Archive -Path .\dist\main -DestinationPath .\BojroDevPower-v6-win64.zip -Force
        working-directory: ./desktop_server

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BojroDevPower-v6-win64
          path: desktop_server/BojroDevPower-v6-win64.zip
          if-no-files-found: error

      - name: Determine Target Release Tag
        id: get_tag
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          fi

          if [ -z "$TAG" ]; then
            echo "Error: No published GitHub release found to attach artifact."
            exit 1
          fi

          echo "target_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target release tag: $TAG"

      - name: Attach zip to GitHub Release
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.target_tag }}
          files: desktop_server/BojroDevPower-v6-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
