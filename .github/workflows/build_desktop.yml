name: Build Desktop App v6

on:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target Release Tag (leave blank to attach to the latest release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./desktop_server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop_server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build onedir application
        run: pyinstaller --noconfirm --onedir --windowed --icon="app.ico" --add-data "app.ico;." main.py

      - name: Create release archive
        run: Compress-Archive -Path .\dist\main -DestinationPath .\BojroDevPower-v6-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BojroDevPower-v6-win64
          path: desktop_server/BojroDevPower-v6-win64.zip
          if-no-files-found: error

      - name: Attach zip to existing GitHub Release
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TARGET_TAG="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TARGET_TAG="${GITHUB_REF#refs/tags/}"
          else
            # Query GitHub CLI for the latest published release tag
            TARGET_TAG=$(gh release view --json tagName -q .tagName)
          fi

          if [ -z "$TARGET_TAG" ]; then
            echo "Error: No existing release found on GitHub."
            exit 1
          fi

          echo "Uploading BojroDevPower-v6-win64.zip to existing release: $TARGET_TAG"
          gh release upload "$TARGET_TAG" desktop_server/BojroDevPower-v6-win64.zip --clobber